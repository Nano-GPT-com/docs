name: Docs Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify notable model IDs block is generated from live catalog
        run: node scripts/sync-notable-model-ids.mjs --check

      - name: Validate model-like IDs in docs against /api/v1/models
        run: node scripts/validate-model-ids.mjs

      - name: Validate canonical example text model
        run: node scripts/validate-example-text-model.mjs

      - name: Verify model host and client pricing guard regressions
        run: node --test scripts/validate-example-text-model.test.mjs

      - name: Verify OpenAPI examples use canonical text model
        run: node scripts/sync-example-text-model.mjs --check

      - name: Setup Python for executable quickstart examples
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install quickstart fixture dependencies
        run: python -m pip install openai==2.8.1 httpx==0.28.1

      - name: Execute published quickstart examples against HTTP and SSE fixtures
        run: python scripts/test-quickstart.py
